<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Theme Logo: Black background with white bug and orange eye -->
  <rect width="1000" height="1000" fill="#0a0a0a"/>
  
  <!-- Bug body (white) -->
  <ellipse cx="500" cy="600" rx="280" ry="320" fill="#ffffff"/>
  
  <!-- Bug head (white) -->
  <circle cx="500" cy="300" r="200" fill="#ffffff"/>
  
  <!-- Left antenna -->
  <g stroke="#ffffff" stroke-width="40" fill="none" stroke-linecap="round">
    <path d="M 380 150 Q 300 80 250 50"/>
    <circle cx="250" cy="50" r="35" fill="#ffffff"/>
  </g>
  
  <!-- Right antenna -->
  <g stroke="#ffffff" stroke-width="40" fill="none" stroke-linecap="round">
    <path d="M 620 150 Q 700 80 750 50"/>
    <circle cx="750" cy="50" r="35" fill="#ffffff"/>
  </g>
  
  <!-- Eye outer ring (white) -->
  <circle cx="500" cy="300" r="120" fill="none" stroke="#ffffff" stroke-width="20"/>
  
  <!-- Eye center (orange) -->
  <circle cx="500" cy="300" r="60" fill="#ff6b35"/>
</svg>
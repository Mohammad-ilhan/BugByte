    <meta name="keywords" content="ZENYX Digitals, web design studio, landing page design, full stack development, e-commerce development, React agency, website design agency, digital studio" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="ZENYX Digitals — Websites that Convert" />

    <link rel="icon" href="/favicon.ico" />

    <script>
      (function () {
        try {
          var t = localStorage.getItem("portfolio-theme");
          if (t !== "water" && t !== "fire") t = "fire";
          var r = document.documentElement;
          if (t === "water") r.classList.add("water");
          else r.classList.remove("water");
        } catch (e) {}
      })();
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ZENYX Digitals",
      "url": "/",
      "description": "Digital studio building landing pages, full-stack websites, and e-commerce platforms.",
      "foundingDate": "2025",
      "areaServed": "Worldwide",
      "sameAs": []
    }
    </script>
  </head>

  </body>
</html>
